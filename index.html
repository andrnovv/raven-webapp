<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RavenMarket</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #12141a;
      --card-bg: #1a1d26;
      --card-selected: #2d3548;
      --accent: #388bfd;
      --price-color: #7ee787;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #30363d;
      --btn-green: #238636;
      --btn-green-hover: #2ea043;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 14px;
      padding-bottom: 85px;
    }

    header {
      margin-bottom: 14px;
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
      font-size: 13px;
    }

    .btn-reset {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .item-card.selected {
      background: var(--card-selected);
      border-color: var(--accent);
    }

    .item-price {
      font-size: 12px;
      font-weight: 700;
      color: var(--price-color);
      margin-bottom: 4px;
    }

    .item-image {
      width: 65px;
      height: 48px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .item-name {
      font-size: 10px;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.2;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 14px;
      background: rgba(18, 20, 26, 0.95);
      border-top: 1px solid var(--border-color);
    }

    .btn-submit {
      width: 100%;
      background: var(--btn-green);
      border: none;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0.4;
      pointer-events: none;
      transition: 0.2s ease;
    }

    .btn-submit.active {
      opacity: 1;
      pointer-events: auto;
    }

    .status-msg {
      text-align: center;
      padding: 35px 10px;
      color: var(--text-muted);
      font-size: 13px;
      grid-column: span 3;
    }
  </style>
</head>
<body>

  <header>
    <h1>Обмен предметов</h1>
    <div class="subtitle">CS2 Inventory</div>
  </header>

  <div class="toolbar">
    <span id="selectedSummary">Выбрано: 0 (0 ₽)</span>
    <button class="btn-reset" id="resetBtn">Сбросить</button>
  </div>

  <div class="grid" id="itemsGrid">
    <div class="status-msg">Загрузка скинов...</div>
  </div>

  <div class="bottom-bar">
    <button class="btn-submit" id="submitBtn">Обменять выбранное</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const API_URL = "https://yellow-lands-relate.loca.lt/api/items";

    let availableItems = [];
    let selectedItemIds = new Set();

    const grid = document.getElementById("itemsGrid");
    const summary = document.getElementById("selectedSummary");
    const resetBtn = document.getElementById("resetBtn");
    const submitBtn = document.getElementById("submitBtn");

    async function fetchCatalog() {
      try {
        const response = await fetch(API_URL, {
          method: "GET",
          headers: {
            "bypass-tunnel-reminder": "true",
            "Bypass-Tunnel-Reminder": "1"
          }
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        availableItems = data.items || [];
        renderGrid();
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="status-msg">Не удалось загрузить инвентарь.<br>Убедись, что запущен api_server.py и туннель.</div>`;
      }
    }

    function renderGrid() {
      if (availableItems.length === 0) {
        grid.innerHTML = `<div class="status-msg">Инвентарь пуст</div>`;
        return;
      }

      grid.innerHTML = "";
      availableItems.forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card" + (selectedItemIds.has(item.id) ? " selected" : "");
        card.onclick = () => toggleSelect(item.id);

        card.innerHTML = `
          <div class="item-price">${Math.round(item.price)} ₽</div>
          <img class="item-image" src="${item.image}" alt="${item.name}" loading="lazy" />
          <div class="item-name">${item.name}</div>
        `;
        grid.appendChild(card);
      });

      updateSummary();
    }

    function toggleSelect(id) {
      if (selectedItemIds.has(id)) {
        selectedItemIds.delete(id);
      } else {
        selectedItemIds.add(id);
      }
      renderGrid();
    }

    function updateSummary() {
      let count = selectedItemIds.size;
      let total = 0;

      availableItems.forEach(item => {
        if (selectedItemIds.has(item.id)) {
          total += Number(item.price);
        }
      });

      summary.textContent = `Выбрано: ${count} (${Math.round(total)} ₽)`;

      if (count > 0) {
        submitBtn.classList.add("active");
        submitBtn.textContent = `Обменять выбранное (${Math.round(total)} ₽)`;
      } else {
        submitBtn.classList.remove("active");
        submitBtn.textContent = "Обменять выбранное";
      }
    }

    resetBtn.onclick = () => {
      selectedItemIds.clear();
      renderGrid();
    };

    submitBtn.onclick = () => {
      if (selectedItemIds.size === 0) return;

      const payloadItems = availableItems
        .filter(item => selectedItemIds.has(item.id))
        .map(item => ({
          asset_id: item.id,
          name: item.name,
          price_rub: item.price
        }));

      const payload = {
        action: "create_trade",
        items: payloadItems
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert("Тестовая отправка:\n" + JSON.stringify(payload, null, 2));
      }
    };

    fetchCatalog();
  </script>
</body>
</html>
