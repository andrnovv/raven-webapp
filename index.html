<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RavenMarket</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f141c;
      --card-bg: #18202c;
      --card-selected: #202d40;
      --border: #283548;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --blue-soft: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --badge-bg: #222f42;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-white);
      padding: 12px;
      padding-bottom: 95px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 6px;
    }

    .stats-container {
      display: flex;
      gap: 6px;
      flex-grow: 1;
    }

    .stat-badge {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 9px;
      color: var(--text-gray);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stat-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-white);
      margin-top: 2px;
      white-space: nowrap;
    }

    .avatar-wrapper {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      font-weight: 700;
      color: var(--blue-soft);
      font-size: 14px;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tabs-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-gray);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--text-white);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-sort, .btn-filter {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-white);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      gap: 8px;
      flex-direction: column;
    }

    .filter-panel.open {
      display: flex;
    }

    .filter-select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-white);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    .items-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .item-card.selected {
      background: var(--card-selected);
      border-color: var(--blue-soft);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.25);
    }

    .card-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .item-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--blue-soft);
    }

    .item-wear {
      font-size: 9px;
      padding: 2px 4px;
      background: var(--badge-bg);
      border-radius: 4px;
      color: var(--text-gray);
      font-weight: 600;
    }

    .item-img {
      width: 90px;
      height: 65px;
      object-fit: contain;
      margin: 4px 0;
    }

    .item-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-white);
      line-height: 1.2;
      height: 26px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: rgba(15, 20, 28, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .btn-trade {
      width: 100%;
      background: var(--accent);
      border: none;
      color: var(--text-white);
      font-size: 14px;
      font-weight: 700;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      opacity: 0.4;
      pointer-events: none;
      transition: 0.2s ease;
    }

    .btn-trade.active {
      opacity: 1;
      pointer-events: auto;
    }

    .btn-trade.disabled-funds {
      background: #374151;
      color: #9ca3af;
      cursor: not-allowed;
      opacity: 0.8;
      pointer-events: none;
    }

    .status-box {
      grid-column: span 2;
      text-align: center;
      padding: 30px 10px;
      color: var(--text-gray);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="stats-container">
      <div class="stat-badge">
        <span class="stat-label">Баланс</span>
        <span class="stat-val" id="profileBalance">0 ₽</span>
      </div>
      <div class="stat-badge">
        <span class="stat-label">Вы отдаете</span>
        <span class="stat-val" id="userGiveSum">0 ₽</span>
      </div>
      <div class="stat-badge">
        <span class="stat-label">Вы получаете</span>
        <span class="stat-val" id="userReceiveSum">0 ₽</span>
      </div>
    </div>
    <div class="avatar-wrapper" id="userAvatar">U</div>
  </div>

  <!-- Tabs Navigation -->
  <div class="tabs-nav">
    <button class="tab-btn active" id="tabUser" onclick="switchTab('user')">Мой инвентарь (<span id="userCount">0</span>)</button>
    <button class="tab-btn" id="tabBot" onclick="switchTab('bot')">Магазин бота (<span id="botCount">0</span>)</button>
  </div>

  <!-- Controls -->
  <div class="controls-row">
    <button class="btn-sort" onclick="toggleSort()">
      <span id="sortLabel">По умолчанию</span>
      <span id="sortArrow">⇅</span>
    </button>
    <button class="btn-filter" onclick="toggleFilterPanel()">
      <span>Фильтры</span>
      <span>⚙️</span>
    </button>
  </div>

  <!-- Filter Panel -->
  <div class="filter-panel" id="filterPanel">
    <select class="filter-select" id="weaponFilter" onchange="applyFilters()">
      <option value="all">Все типы</option>
      <option value="AK-47">AK-47</option>
      <option value="AWP">AWP</option>
      <option value="M4A1-S">M4A1-S</option>
      <option value="Desert Eagle">Desert Eagle</option>
      <option value="USP-S">USP-S</option>
      <option value="Glock-18">Glock-18</option>
      <option value="CZ75">CZ75</option>
      <option value="Нож">Ножи</option>
      <option value="Кейс">Кейсы</option>
    </select>

    <select class="filter-select" id="wearFilter" onchange="applyFilters()">
      <option value="all">Любой износ</option>
      <option value="FN">Factory New</option>
      <option value="MW">Minimal Wear</option>
      <option value="FT">Field-Tested</option>
      <option value="WW">Well-Worn</option>
      <option value="BS">Battle-Scarred</option>
    </select>
  </div>

  <!-- Items Grid -->
  <div class="items-grid" id="itemsGrid">
    <div class="status-box">Загрузка предметов...</div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <button class="btn-trade" id="tradeBtn" onclick="submitTrade()">Выберите предметы</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const BASE_URL = "https://large-jeans-lose.loca.lt/";
    const currentTgId = tg?.initDataUnsafe?.user?.id || 676723587;

    const tgUser = tg?.initDataUnsafe?.user;
    const avatarWrapper = document.getElementById("userAvatar");
    if (tgUser && tgUser.photo_url) {
      avatarWrapper.innerHTML = `<img class="avatar-img" src="${tgUser.photo_url}" alt="User">`;
    } else if (tgUser && tgUser.first_name) {
      avatarWrapper.textContent = tgUser.first_name[0].toUpperCase();
    }

    let activeTab = "user";
    let botItems = [];
    let userItems = [];
    let displayedItems = [];

    // Независимые сеты выбранных предметов
    let selectedUserIds = new Set();
    let selectedBotIds = new Set();

    let userBalance = 0.0;
    let sortState = 0;
    let isUserLoaded = false;
    let isBotLoaded = false;

    function extractWear(name) {
      const n = (name || "").toLowerCase();
      if (n.includes("factory new") || n.includes("прямо с завода")) return "FN";
      if (n.includes("minimal wear") || n.includes("немного поношенное")) return "MW";
      if (n.includes("field-tested") || n.includes("после полевых")) return "FT";
      if (n.includes("well-worn") || n.includes("поношенное")) return "WW";
      if (n.includes("battle-scarred") || n.includes("закаленное")) return "BS";
      return "";
    }

    async function loadProfile() {
      try {
        const res = await fetch(`${BASE_URL}/api/user-profile?telegram_id=${currentTgId}`, {
          headers: { "bypass-tunnel-reminder": "true" }
        });
        if (res.ok) {
          const data = await res.json();
          userBalance = Number(data.balance || 0);
          document.getElementById("profileBalance").textContent = `${Math.round(userBalance)} ₽`;
          updateSummary();
        }
      } catch (e) {}
    }

    async function loadUserInventory() {
      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = `<div class="status-box">Синхронизация инвентаря Steam...</div>`;

      try {
        const res = await fetch(`${BASE_URL}/api/user-items?telegram_id=${currentTgId}`, {
          headers: { "bypass-tunnel-reminder": "true" }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || `Ошибка ${res.status}`);

        userItems = (data.items || []).map(i => ({
          ...i,
          wear: i.wear ? extractWear(i.wear) : extractWear(i.name)
        }));
        isUserLoaded = true;
        applyFilters();
      } catch (e) {
        grid.innerHTML = `<div class="status-box">${e.message}</div>`;
      }
    }

    async function loadBotCatalog() {
      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = `<div class="status-box">Загрузка каталога бота...</div>`;

      try {
        const res = await fetch(`${BASE_URL}/api/items`, {
          headers: { "bypass-tunnel-reminder": "true" }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        botItems = (data.items || []).map(i => ({
          ...i,
          wear: i.wear ? extractWear(i.wear) : extractWear(i.name)
        }));
        isBotLoaded = true;
        applyFilters();
      } catch (e) {
        grid.innerHTML = `<div class="status-box">Ошибка загрузки витрины бота.</div>`;
      }
    }

    function switchTab(tab) {
      if (activeTab === tab) return;
      activeTab = tab;

      document.getElementById("tabUser").classList.toggle("active", tab === "user");
      document.getElementById("tabBot").classList.toggle("active", tab === "bot");

      if (tab === "user") {
        if (!isUserLoaded) loadUserInventory();
        else applyFilters();
      } else {
        if (!isBotLoaded) loadBotCatalog();
        else applyFilters();
      }
    }

    function toggleFilterPanel() {
      document.getElementById("filterPanel").classList.toggle("open");
    }

    function toggleSort() {
      sortState = (sortState + 1) % 3;
      const label = document.getElementById("sortLabel");
      const arrow = document.getElementById("sortArrow");

      if (sortState === 0) {
        label.textContent = "По умолчанию";
        arrow.textContent = "⇅";
      } else if (sortState === 1) {
        label.textContent = "Цена: дешевле";
        arrow.textContent = "↑";
      } else {
        label.textContent = "Цена: дороже";
        arrow.textContent = "↓";
      }
      applyFilters();
    }

    function applyFilters() {
      const sourceList = activeTab === "user" ? userItems : botItems;
      const weapon = document.getElementById("weaponFilter").value;
      const wear = document.getElementById("wearFilter").value;

      displayedItems = sourceList.filter(item => {
        const name = (item.name || "").toLowerCase();
        let matchWeapon = true;
        if (weapon !== "all") {
          if (weapon === "Нож") matchWeapon = name.includes("нож") || name.includes("knife") || name.includes("★");
          else matchWeapon = name.includes(weapon.toLowerCase());
        }

        let matchWear = (wear === "all") || (item.wear === wear);
        return matchWeapon && matchWear;
      });

      if (sortState === 1) {
        displayedItems.sort((a, b) => Number(a.price) - Number(b.price));
      } else if (sortState === 2) {
        displayedItems.sort((a, b) => Number(b.price) - Number(a.price));
      }

      renderGrid();
      updateSummary();
    }

    function renderGrid() {
      const grid = document.getElementById("itemsGrid");
      const currentSelected = activeTab === "user" ? selectedUserIds : selectedBotIds;

      if (displayedItems.length === 0) {
        grid.innerHTML = `<div class="status-box">Предметы не найдены</div>`;
        return;
      }

      grid.innerHTML = "";
      displayedItems.forEach(item => {
        const isSel = currentSelected.has(item.id);
        const card = document.createElement("div");
        card.className = "item-card" + (isSel ? " selected" : "");
        card.onclick = () => toggleSelect(item.id);

        const wearBadge = item.wear ? `<span class="item-wear">${item.wear}</span>` : "";

        card.innerHTML = `
          <div class="card-top">
            <span class="item-price">${Math.round(item.price)} ₽</span>
            ${wearBadge}
          </div>
          <img class="item-img" src="${item.image}" alt="${item.name}" loading="lazy">
          <div class="item-title">${item.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleSelect(id) {
      const currentSelected = activeTab === "user" ? selectedUserIds : selectedBotIds;
      if (currentSelected.has(id)) {
        currentSelected.delete(id);
      } else {
        currentSelected.add(id);
      }
      renderGrid();
      updateSummary();
    }

    function updateSummary() {
      document.getElementById("userCount").textContent = selectedUserIds.size;
      document.getElementById("botCount").textContent = selectedBotIds.size;

      let giveSum = 0;
      userItems.forEach(i => {
        if (selectedUserIds.has(i.id)) giveSum += Number(i.price || 0);
      });

      let receiveSum = 0;
      botItems.forEach(i => {
        if (selectedBotIds.has(i.id)) receiveSum += Number(i.price || 0);
      });

      document.getElementById("userGiveSum").textContent = `${Math.round(giveSum)} ₽`;
      document.getElementById("userReceiveSum").textContent = `${Math.round(receiveSum)} ₽`;

      const btn = document.getElementById("tradeBtn");
      btn.className = "btn-trade";

      if (selectedUserIds.size === 0 && selectedBotIds.size === 0) {
        btn.textContent = "Выберите предметы";
        return;
      }

      // Дельта = Отдаем - Получаем
      const delta = Math.round(giveSum - receiveSum);

      if (delta > 0) {
        btn.classList.add("active");
        btn.textContent = `Обменять (+${delta} ₽ на баланс)`;
      } else if (delta < 0) {
        const needPay = Math.abs(delta);
        if (userBalance >= needPay) {
          btn.classList.add("active");
          btn.textContent = `Обменять (-${needPay} ₽ с баланса)`;
        } else {
          btn.classList.add("disabled-funds");
          btn.textContent = `Не хватает ${needPay - Math.round(userBalance)} ₽ на балансе`;
        }
      } else {
        btn.classList.add("active");
        btn.textContent = "Равноценный обмен";
      }
    }

    function submitTrade() {
      const giveItems = userItems
        .filter(i => selectedUserIds.has(i.id))
        .map(i => ({ asset_id: i.id, name: i.name, price_rub: i.price }));

      const receiveItems = botItems
        .filter(i => selectedBotIds.has(i.id))
        .map(i => ({ asset_id: i.id, name: i.name, price_rub: i.price }));

      const giveSum = giveItems.reduce((acc, i) => acc + Number(i.price_rub || 0), 0);
      const receiveSum = receiveItems.reduce((acc, i) => acc + Number(i.price_rub || 0), 0);
      const delta = Math.round(giveSum - receiveSum);

      const payload = {
        action: "exchange",
        give_items: giveItems,
        receive_items: receiveItems,
        give_sum: Math.round(giveSum),
        receive_sum: Math.round(receiveSum),
        delta: delta
      };

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert("Payload:\n" + JSON.stringify(payload, null, 2));
      }
    }

    // Инициализация при старте
    loadProfile();
    loadUserInventory();
  </script>
</body>
</html>
