<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Raven Market | CS2 Trade</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-main: #0f141c;
      --bg-card: #18202c;
      --bg-hover: #1f2a3a;
      --border-color: #273447;
      --accent-blue: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --badge-bg: #1e293b;
      --badge-text: #38bdf8;
      --price-color: #38bdf8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* Навигация по табам */
    .tabs-header {
      display: flex;
      background-color: #131b26;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--accent-blue);
      background-color: rgba(37, 99, 235, 0.05);
    }

    /* Блок поиска и фильтров */
    .toolbar {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #131b26;
      border-bottom: 1px solid var(--border-color);
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }

    .filters-row {
      display: flex;
      gap: 8px;
    }

    .filter-select {
      flex: 1;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text-muted);
      font-size: 13px;
      outline: none;
    }

    /* Сетка предметов 2 в ряд */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 14px;
    }

    .item-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .item-card:active {
      transform: scale(0.98);
    }

    .item-card.selected {
      border-color: var(--accent-blue);
      background-color: rgba(37, 99, 235, 0.08);
      box-shadow: 0 0 0 1px var(--accent-blue);
    }

    .item-img-wrap {
      width: 100%;
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .item-img {
      max-width: 95%;
      max-height: 95px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    .item-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 6px;
      height: 34px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      margin-bottom: 8px;
      width: 100%;
    }

    .badge-wear {
      font-size: 10px;
      padding: 2px 6px;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      border-radius: 4px;
      white-space: nowrap;
    }

    .badge-float {
      font-size: 10px;
      padding: 2px 6px;
      background-color: #243042;
      color: #cbd5e1;
      border-radius: 4px;
      font-family: monospace;
    }

    .item-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--price-color);
      margin-top: auto;
    }

    /* Статусные сообщения */
    .status-box {
      grid-column: span 2;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .loader {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: var(--accent-blue);
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Нижняя плашка действий */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #131b26;
      border-top: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
    }

    .summary-info {
      display: flex;
      flex-direction: column;
    }

    .summary-count {
      font-size: 12px;
      color: var(--text-muted);
    }

    .summary-total {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .action-btn {
      background-color: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .action-btn:disabled {
      background-color: #273447;
      color: #64748b;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Навигация -->
  <div class="tabs-header">
    <button class="tab-btn active" id="tabBot" onclick="switchTab('bot')">Скины бота</button>
    <button class="tab-btn" id="tabUser" onclick="switchTab('user')">Мой инвентарь</button>
  </div>

  <!-- Поиск и фильтрация -->
  <div class="toolbar">
    <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию..." oninput="handleFilterChange()" />
    <div class="filters-row">
      <select id="typeFilter" class="filter-select" onchange="handleFilterChange()">
        <option value="all">Все типы</option>
        <option value="knife">Ножи</option>
        <option value="rifle">Винтовки (AK, M4, AWP)</option>
        <option value="pistol">Пистолеты</option>
        <option value="other">Прочее / Кейсы</option>
      </select>
      <select id="wearFilter" class="filter-select" onchange="handleFilterChange()">
        <option value="all">Любой износ</option>
        <option value="Прямо с завода">Прямо с завода</option>
        <option value="Немного поношенное">Немного поношенное</option>
        <option value="После полевых">После полевых</option>
        <option value="Поношенное">Поношенное</option>
        <option value="Закаленное в боях">Закаленное в боях</option>
      </select>
    </div>
  </div>

  <!-- Контейнер карточек -->
  <div class="grid-container" id="itemsGrid">
    <div class="status-box">
      <div class="loader"></div><br />
      Подключение к серверу...
    </div>
  </div>

  <!-- Нижняя панель действий -->
  <div class="action-bar">
    <div class="summary-info">
      <span class="summary-count" id="selectedCount">Выбрано: 0</span>
      <span class="summary-total" id="selectedTotal">0.00 ₽</span>
    </div>
    <button class="action-btn" id="submitBtn" disabled onclick="submitTradeAction()">Создать обмен</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Твой рабочий туннель localtunnel
    const BASE_URL = "https://heavy-eyes-move.loca.lt";

    // Получение Telegram ID пользователя
    const currentTgId = tg?.initDataUnsafe?.user?.id || 676723587;

    let currentTab = "bot";
    let botItems = [];
    let userItems = [];
    let selectedItemIds = new Set();
    let isUserInvLoading = false;

    // Вспомогательное извлечение качества для предметов пользователя
    function extractWear(name) {
      const match = name.match(/\(([^)]+)\)/);
      if (!match) return "";
      const w = match[1];
      if (w.includes("Factory New")) return "Прямо с завода";
      if (w.includes("Minimal Wear")) return "Немного поношенное";
      if (w.includes("Field-Tested")) return "После полевых";
      if (w.includes("Well-Worn")) return "Поношенное";
      if (w.includes("Battle-Scarred")) return "Закаленное в боях";
      return w;
    }

    // Переключение табов
    function switchTab(tab) {
      if (currentTab === tab) return;
      currentTab = tab;
      selectedItemIds.clear();
      updateSummary();

      document.getElementById("tabBot").classList.toggle("active", tab === "bot");
      document.getElementById("tabUser").classList.toggle("active", tab === "user");

      if (tab === "bot") {
        if (botItems.length === 0) fetchBotItems();
        else renderItems(filterItems(botItems));
      } else {
        if (userItems.length === 0) fetchUserItems();
        else renderItems(filterItems(userItems));
      }
    }

    // Загрузка скинов магазина бота
    async function fetchBotItems() {
      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = `<div class="status-box"><div class="loader"></div><br/>Загрузка каталога бота...</div>`;

      try {
        const res = await fetch(`${BASE_URL}/api/items`, {
          headers: { "bypass-tunnel-reminder": "true" }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        botItems = data.items || [];
        renderItems(filterItems(botItems));
      } catch (err) {
        grid.innerHTML = `<div class="status-box">Не удалось загрузить витрину бота.<br/>Проверьте работу туннеля.</div>`;
      }
    }

    // Загрузка инвентаря пользователя с защитой от спама
    async function fetchUserItems() {
      if (isUserInvLoading) return;
      isUserInvLoading = true;

      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = `<div class="status-box"><div class="loader"></div><br/>Синхронизация инвентаря со Steam...</div>`;

      try {
        const res = await fetch(`${BASE_URL}/api/user-items?telegram_id=${currentTgId}`, {
          headers: { "bypass-tunnel-reminder": "true" }
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || `Ошибка ${res.status}`);
        }

        userItems = (data.items || []).map(item => ({
          ...item,
          wear: item.wear || extractWear(item.name),
          float_val: item.float_val || ""
        }));

        renderItems(filterItems(userItems));
      } catch (err) {
        grid.innerHTML = `<div class="status-box">${err.message}</div>`;
      } finally {
        isUserInvLoading = false;
      }
    }

    // Фильтрация
    function filterItems(itemsList) {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const typeFilter = document.getElementById("typeFilter").value;
      const wearFilter = document.getElementById("wearFilter").value;

      return itemsList.filter(item => {
        const name = (item.name || "").toLowerCase();

        if (query && !name.includes(query)) return false;

        if (wearFilter !== "all") {
          if (!item.wear || !item.wear.includes(wearFilter)) return false;
        }

        if (typeFilter === "knife" && !name.includes("нож") && !name.includes("knife") && !name.includes("★")) return false;
        if (typeFilter === "rifle" && !name.includes("ak-47") && !name.includes("m4a1") && !name.includes("m4a4") && !name.includes("awp")) return false;
        if (typeFilter === "pistol" && !name.includes("usp") && !name.includes("glock") && !name.includes("desert eagle") && !name.includes("cz75")) return false;
        if (typeFilter === "other" && (name.includes("нож") || name.includes("ak-47") || name.includes("m4") || name.includes("awp") || name.includes("usp") || name.includes("glock"))) return false;

        return true;
      });
    }

    function handleFilterChange() {
      const source = currentTab === "bot" ? botItems : userItems;
      renderItems(filterItems(source));
    }

    // Отрисовка списка предметов
    function renderItems(items) {
      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = "";

      if (items.length === 0) {
        grid.innerHTML = `<div class="status-box">Предметы не найдены</div>`;
        return;
      }

      items.forEach(item => {
        const isSelected = selectedItemIds.has(item.id);
        const card = document.createElement("div");
        card.className = `item-card ${isSelected ? "selected" : ""}`;
        card.onclick = () => toggleSelectItem(item.id);

        const wearBadge = item.wear ? `<span class="badge-wear">${item.wear}</span>` : "";
        const floatBadge = item.float_val ? `<span class="badge-float">Float: ${item.float_val}</span>` : "";

        card.innerHTML = `
          <div class="item-img-wrap">
            <img class="item-img" src="${item.image}" alt="${item.name}" loading="lazy" />
          </div>
          <div class="item-name">${item.name}</div>
          <div class="meta-tags">
            ${wearBadge}
            ${floatBadge}
          </div>
          <div class="item-price">${item.price.toFixed(2)} ₽</div>
        `;
        grid.appendChild(card);
      });
    }

    // Выбор предметов
    function toggleSelectItem(id) {
      if (selectedItemIds.has(id)) {
        selectedItemIds.delete(id);
      } else {
        selectedItemIds.add(id);
      }
      handleFilterChange();
      updateSummary();
    }

    // Обновление нижней панели
    function updateSummary() {
      const source = currentTab === "bot" ? botItems : userItems;
      const selected = source.filter(i => selectedItemIds.has(i.id));

      const count = selected.length;
      const total = selected.reduce((sum, i) => sum + Number(i.price || 0), 0);

      document.getElementById("selectedCount").textContent = `Выбрано: ${count}`;
      document.getElementById("selectedTotal").textContent = `${total.toFixed(2)} ₽`;

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = count === 0;
      submitBtn.textContent = currentTab === "bot" ? "Купить у бота" : "Передать боту";
    }

    // Отправка заявки в Telegram-бот
    function submitTradeAction() {
      const source = currentTab === "bot" ? botItems : userItems;
      const selected = source.filter(i => selectedItemIds.has(i.id));

      if (selected.length === 0) return;

      const payload = {
        tab: currentTab,
        items: selected.map(i => ({
          asset_id: i.id,
          name: i.name,
          price_rub: i.price
        }))
      };

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert(`Данные для отправки:\n${JSON.stringify(payload, null, 2)}`);
      }
    }

    // Первый запуск
    fetchBotItems();
  </script>
</body>
</html>
