<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RavenMarket</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f141c;
      --card-bg: #18202c;
      --card-selected: #202d40;
      --border: #283548;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --blue-soft: #38bdf8;
      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --badge-bg: #222f42;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-white);
      padding: 14px;
      padding-bottom: 95px;
    }

    /* Верхний блок профиля и статистики */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .stats-container {
      display: flex;
      gap: 8px;
    }

    .stat-badge {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-gray);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-white);
      margin-top: 1px;
    }

    .avatar-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      font-weight: 700;
      color: var(--blue-soft);
      font-size: 16px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Навигация по вкладкам */
    .tabs-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-gray);
      font-size: 13px;
      font-weight: 600;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--text-white);
    }

    /* Панель управления */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn-sort, .btn-filter {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-white);
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      gap: 8px;
      flex-direction: column;
    }

    .filter-panel.open {
      display: flex;
    }

    .filter-select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-white);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    /* Сетка карточек */
    .items-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .item-card.selected {
      background: var(--card-selected);
      border-color: var(--blue-soft);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    .card-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .item-price {
      font-size: 13px;
      font-weight: 700;
      color: var(--blue-soft);
    }

    .badge-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .item-wear {
      font-size: 9px;
      padding: 2px 5px;
      background: var(--badge-bg);
      border-radius: 4px;
      color: var(--text-gray);
      font-weight: 600;
    }

    .item-float {
      font-size: 8px;
      padding: 2px 4px;
      background: #1f2937;
      border-radius: 4px;
      color: #93c5fd;
      font-family: monospace;
    }

    .item-img {
      width: 95px;
      height: 70px;
      object-fit: contain;
      margin: 6px 0;
    }

    .item-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-white);
      line-height: 1.25;
      height: 28px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Нижняя плашка действий */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px;
      background: rgba(15, 20, 28, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .btn-trade {
      width: 100%;
      background: var(--accent);
      border: none;
      color: var(--text-white);
      font-size: 15px;
      font-weight: 700;
      padding: 13px;
      border-radius: 10px;
      cursor: pointer;
      opacity: 0.4;
      pointer-events: none;
      transition: 0.2s ease;
    }

    .btn-trade.active {
      opacity: 1;
      pointer-events: auto;
    }

    .status-box {
      grid-column: span 2;
      text-align: center;
      padding: 40px 10px;
      color: var(--text-gray);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="stats-container">
      <div class="stat-badge">
        <span class="stat-label">Инвентарь</span>
        <span class="stat-val" id="totalInventorySum">0 ₽</span>
      </div>
      <div class="stat-badge">
        <span class="stat-label">Выбрано</span>
        <span class="stat-val" id="selectedSum">0 ₽</span>
      </div>
    </div>
    <div class="avatar-wrapper" id="userAvatar">U</div>
  </div>

  <!-- Tabs Navigation -->
  <div class="tabs-nav">
    <button class="tab-btn" id="tabUser" onclick="switchTab('user')">Мой инвентарь</button>
    <button class="tab-btn active" id="tabBot" onclick="switchTab('bot')">Магазин бота</button>
  </div>

  <!-- Filters & Sort Controls -->
  <div class="controls-row">
    <button class="btn-sort" id="sortBtn" onclick="toggleSort()">
      <span id="sortLabel">По умолчанию</span>
      <span id="sortArrow">⇅</span>
    </button>
    <button class="btn-filter" onclick="toggleFilterPanel()">
      <span>Фильтры</span>
      <span>⚙️</span>
    </button>
  </div>

  <!-- Filter Dropdowns -->
  <div class="filter-panel" id="filterPanel">
    <select class="filter-select" id="weaponFilter" onchange="applyFilters()">
      <option value="all">Все типы</option>
      <option value="AK-47">AK-47</option>
      <option value="AWP">AWP</option>
      <option value="M4A1-S">M4A1-S</option>
      <option value="Desert Eagle">Desert Eagle</option>
      <option value="USP-S">USP-S</option>
      <option value="Glock-18">Glock-18</option>
      <option value="CZ75">CZ75</option>
      <option value="Нож">Ножи</option>
      <option value="Кейс">Кейсы</option>
    </select>

    <select class="filter-select" id="wearFilter" onchange="applyFilters()">
      <option value="all">Любой износ</option>
      <option value="FN">Factory New (Прямо с завода)</option>
      <option value="MW">Minimal Wear (Немного поношенное)</option>
      <option value="FT">Field-Tested (После полевых)</option>
      <option value="WW">Well-Worn (Поношенное)</option>
      <option value="BS">Battle-Scarred (Закаленное в боях)</option>
    </select>
  </div>

  <!-- Items Grid -->
  <div class="items-grid" id="itemsGrid">
    <div class="status-box">Загрузка скинов...</div>
  </div>

  <!-- Action Bar -->
  <div class="bottom-bar">
    <button class="btn-trade" id="tradeBtn" onclick="submitTrade()">Купить у бота</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Актуальный адрес туннеля localtunnel
    const BASE_URL = "https://large-jeans-lose.loca.lt/";
    const currentTgId = tg?.initDataUnsafe?.user?.id || 676723587;

    // Отображение аватара пользователя
    const tgUser = tg?.initDataUnsafe?.user;
    const avatarWrapper = document.getElementById("userAvatar");
    if (tgUser && tgUser.photo_url) {
      avatarWrapper.innerHTML = `<img class="avatar-img" src="${tgUser.photo_url}" alt="User">`;
    } else if (tgUser && tgUser.first_name) {
      avatarWrapper.textContent = tgUser.first_name[0].toUpperCase();
    }

    let activeTab = "bot";
    let botItems = [];
    let userItems = [];
    let displayedItems = [];
    let selectedIds = new Set();
    let sortState = 0; // 0: default, 1: asc, 2: desc
    let isUserLoading = false;

    function extractWear(name) {
      const n = (name || "").toLowerCase();
      if (n.includes("factory new") || n.includes("прямо с завода")) return "FN";
      if (n.includes("minimal wear") || n.includes("немного поношенное")) return "MW";
      if (n.includes("field-tested") || n.includes("после полевых")) return "FT";
      if (n.includes("well-worn") || n.includes("поношенное")) return "WW";
      if (n.includes("battle-scarred") || n.includes("закаленное")) return "BS";
      return "";
    }

    async function loadBotCatalog() {
      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = `<div class="status-box">Загрузка каталога бота...</div>`;

      try {
        const res = await fetch(`${BASE_URL}/api/items`, {
          headers: { "bypass-tunnel-reminder": "true" }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        
        botItems = (data.items || []).map(i => ({
          ...i,
          wear: i.wear ? extractWear(i.wear) : extractWear(i.name),
          float_val: i.float_val || ""
        }));
        
        applyFilters();
      } catch (e) {
        grid.innerHTML = `<div class="status-box">Ошибка загрузки каталога.<br>Проверьте туннель localtunnel.</div>`;
      }
    }

    async function loadUserCatalog() {
      if (isUserLoading) return;
      isUserLoading = true;

      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = `<div class="status-box">Синхронизация инвентаря Steam...</div>`;

      try {
        const res = await fetch(`${BASE_URL}/api/user-items?telegram_id=${currentTgId}`, {
          headers: { "bypass-tunnel-reminder": "true" }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || `Ошибка ${res.status}`);

        userItems = (data.items || []).map(i => ({
          ...i,
          wear: i.wear ? extractWear(i.wear) : extractWear(i.name),
          float_val: i.float_val || ""
        }));

        applyFilters();
      } catch (e) {
        grid.innerHTML = `<div class="status-box">${e.message}</div>`;
      } finally {
        isUserLoading = false;
      }
    }

    function switchTab(tab) {
      if (activeTab === tab) return;
      activeTab = tab;
      selectedIds.clear();

      document.getElementById("tabUser").classList.toggle("active", tab === "user");
      document.getElementById("tabBot").classList.toggle("active", tab === "bot");

      if (tab === "bot") {
        if (botItems.length === 0) loadBotCatalog();
        else applyFilters();
      } else {
        if (userItems.length === 0) loadUserCatalog();
        else applyFilters();
      }
    }

    function toggleFilterPanel() {
      document.getElementById("filterPanel").classList.toggle("open");
    }

    function toggleSort() {
      sortState = (sortState + 1) % 3;
      const label = document.getElementById("sortLabel");
      const arrow = document.getElementById("sortArrow");

      if (sortState === 0) {
        label.textContent = "По умолчанию";
        arrow.textContent = "⇅";
      } else if (sortState === 1) {
        label.textContent = "Цена: дешевле";
        arrow.textContent = "↑";
      } else {
        label.textContent = "Цена: дороже";
        arrow.textContent = "↓";
      }
      applyFilters();
    }

    function applyFilters() {
      const sourceList = activeTab === "bot" ? botItems : userItems;
      const weapon = document.getElementById("weaponFilter").value;
      const wear = document.getElementById("wearFilter").value;

      displayedItems = sourceList.filter(item => {
        const name = (item.name || "").toLowerCase();
        let matchWeapon = true;
        if (weapon !== "all") {
          if (weapon === "Нож") matchWeapon = name.includes("нож") || name.includes("knife") || name.includes("★");
          else matchWeapon = name.includes(weapon.toLowerCase());
        }

        let matchWear = (wear === "all") || (item.wear === wear);
        return matchWeapon && matchWear;
      });

      if (sortState === 1) {
        displayedItems.sort((a, b) => Number(a.price) - Number(b.price));
      } else if (sortState === 2) {
        displayedItems.sort((a, b) => Number(b.price) - Number(a.price));
      }

      renderGrid();
      updateSummary();
    }

    function renderGrid() {
      const grid = document.getElementById("itemsGrid");

      if (displayedItems.length === 0) {
        grid.innerHTML = `<div class="status-box">Ничего не найдено</div>`;
        return;
      }

      grid.innerHTML = "";
      displayedItems.forEach(item => {
        const isSel = selectedIds.has(item.id);
        const card = document.createElement("div");
        card.className = "item-card" + (isSel ? " selected" : "");
        card.onclick = () => toggleSelect(item.id);

        const wearBadge = item.wear ? `<span class="item-wear">${item.wear}</span>` : "";
        const floatBadge = item.float_val ? `<span class="item-float">${item.float_val}</span>` : "";

        card.innerHTML = `
          <div class="card-top">
            <span class="item-price">${Math.round(item.price)} ₽</span>
            <div class="badge-group">
              ${wearBadge}
              ${floatBadge}
            </div>
          </div>
          <img class="item-img" src="${item.image}" alt="${item.name}" loading="lazy">
          <div class="item-title">${item.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      renderGrid();
      updateSummary();
    }

    function updateSummary() {
      // Сумма в плашке «Инвентарь» всегда отражает баланс скинов пользователя
      let userTotal = userItems.reduce((acc, i) => acc + Number(i.price || 0), 0);
      document.getElementById("totalInventorySum").textContent = `${Math.round(userTotal)} ₽`;

      // Считаем выбранные предметы из текущей активной вкладки
      const sourceList = activeTab === "bot" ? botItems : userItems;
      let selTotal = 0;
      sourceList.forEach(i => {
        if (selectedIds.has(i.id)) selTotal += Number(i.price || 0);
      });

      document.getElementById("selectedSum").textContent = `${Math.round(selTotal)} ₽`;

      const btn = document.getElementById("tradeBtn");
      const actionText = activeTab === "bot" ? "Купить" : "Передать";
      if (selectedIds.size > 0) {
        btn.classList.add("active");
        btn.textContent = `${actionText} (${selectedIds.size}) на ${Math.round(selTotal)} ₽`;
      } else {
        btn.classList.remove("active");
        btn.textContent = activeTab === "bot" ? "Купить у бота" : "Передать боту";
      }
    }

    function submitTrade() {
      if (selectedIds.size === 0) return;
      const sourceList = activeTab === "bot" ? botItems : userItems;

      const itemsToSend = sourceList
        .filter(i => selectedIds.has(i.id))
        .map(i => ({
          asset_id: i.id,
          name: i.name,
          price_rub: i.price
        }));

      const payload = {
        tab: activeTab,
        items: itemsToSend
      };

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert("Данные для отправки:\n" + JSON.stringify(payload, null, 2));
      }
    }

    // Загрузка витрины бота и тихая фоновая предзагрузка инвентаря пользователя
    loadBotCatalog();
    if (userItems.length === 0) {
      fetch(`${BASE_URL}/api/user-items?telegram_id=${currentTgId}`, {
        headers: { "bypass-tunnel-reminder": "true" }
      })
      .then(r => r.json())
      .then(d => {
        if (d.items) {
          userItems = d.items.map(i => ({
            ...i,
            wear: i.wear ? extractWear(i.wear) : extractWear(i.name),
            float_val: i.float_val || ""
          }));
          updateSummary();
        }
      })
      .catch(() => {});
    }
  </script>
</body>
</html>
