<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RavenMarket</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #12171e;
      color: #ffffff;
      padding-bottom: 85px;
    }

    /* Навигация по вкладкам */
    .tabs {
      display: flex;
      background: #171e28;
      border-bottom: 1px solid #232d3c;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      color: #8c9ba5;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab.active {
      color: #ffffff;
      border-bottom-color: #2f6bf2;
    }

    /* Сетка предметов */
    .catalog {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 14px;
    }

    .card {
      background: #19222d;
      border: 1px solid #253344;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
      position: relative;
    }

    .card:active {
      transform: scale(0.97);
    }

    .card.selected {
      border-color: #2f6bf2;
      background: #1a283b;
      box-shadow: 0 0 0 1px #2f6bf2;
    }

    .img-box {
      width: 100%;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .img-box img {
      max-width: 90%;
      max-height: 90px;
      object-fit: contain;
    }

    .item-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
      height: 34px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .price {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      margin-top: auto;
    }

    /* Статус и загрузка */
    .status-msg {
      grid-column: span 2;
      text-align: center;
      padding: 50px 20px;
      color: #8c9ba5;
      font-size: 14px;
    }

    /* Нижняя плашка действий */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #171e28;
      border-top: 1px solid #232d3c;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .total-info {
      display: flex;
      flex-direction: column;
    }

    .total-count {
      font-size: 12px;
      color: #8c9ba5;
    }

    .total-sum {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
    }

    .trade-btn {
      background: #2f6bf2;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .trade-btn:disabled {
      background: #232d3c;
      color: #5d6e82;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Табы -->
  <div class="tabs">
    <div class="tab active" id="tabBot" onclick="changeTab('bot')">Скины бота</div>
    <div class="tab" id="tabUser" onclick="changeTab('user')">Мой инвентарь</div>
  </div>

  <!-- Витрина скинов -->
  <div class="catalog" id="catalogBox">
    <div class="status-msg">Загрузка каталога...</div>
  </div>

  <!-- Нижняя панель создания трейда -->
  <div class="bottom-bar">
    <div class="total-info">
      <span class="total-count" id="lblCount">Выбрано: 0</span>
      <span class="total-sum" id="lblSum">0.00 ₽</span>
    </div>
    <button class="trade-btn" id="btnSubmit" disabled onclick="sendTradeRequest()">Передать боту</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Актуальный адрес бэкенда
    const BASE_URL = "https://dull-geckos-do.loca.lt/";
    const telegramId = tg?.initDataUnsafe?.user?.id || 676723587;

    let activeTab = "bot";
    let botItems = [];
    let userItems = [];
    let selectedIds = new Set();
    let isUserLoading = false;

    // Смена вкладки
    function changeTab(tab) {
      if (activeTab === tab) return;
      activeTab = tab;
      selectedIds.clear();
      updateBottomBar();

      document.getElementById("tabBot").classList.toggle("active", tab === "bot");
      document.getElementById("tabUser").classList.toggle("active", tab === "user");

      if (tab === "bot") {
        if (botItems.length === 0) loadBotCatalog();
        else renderCatalog(botItems);
      } else {
        if (userItems.length === 0) loadUserCatalog();
        else renderCatalog(userItems);
      }
    }

    // Загрузка скинов бота
    async function loadBotCatalog() {
      const box = document.getElementById("catalogBox");
      box.innerHTML = `<div class="status-msg">Загрузка предметов бота...</div>`;

      try {
        const res = await fetch(`${BASE_URL}/api/items`, {
          headers: { "bypass-tunnel-reminder": "true" }
        });
        if (!res.ok) throw new Error("Ошибка соединения с сервером");
        const data = await res.json();
        botItems = data.items || [];
        renderCatalog(botItems);
      } catch (err) {
        box.innerHTML = `<div class="status-msg">${err.message}</div>`;
      }
    }

    // Загрузка инвентаря пользователя
    async function loadUserCatalog() {
      if (isUserLoading) return;
      isUserLoading = true;

      const box = document.getElementById("catalogBox");
      box.innerHTML = `<div class="status-msg">Синхронизация инвентаря Steam...</div>`;

      try {
        const res = await fetch(`${BASE_URL}/api/user-items?telegram_id=${telegramId}`, {
          headers: { "bypass-tunnel-reminder": "true" }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Не удалось загрузить инвентарь");

        userItems = data.items || [];
        renderCatalog(userItems);
      } catch (err) {
        box.innerHTML = `<div class="status-msg">${err.message}</div>`;
      } finally {
        isUserLoading = false;
      }
    }

    // Отрисовка карточек
    function renderCatalog(items) {
      const box = document.getElementById("catalogBox");
      box.innerHTML = "";

      if (!items || items.length === 0) {
        box.innerHTML = `<div class="status-msg">Инвентарь пуст</div>`;
        return;
      }

      items.forEach(item => {
        const isSelected = selectedIds.has(item.id);
        const card = document.createElement("div");
        card.className = `card ${isSelected ? "selected" : ""}`;
        card.onclick = () => selectItem(item.id);

        card.innerHTML = `
          <div class="img-box">
            <img src="${item.image}" alt="${item.name}" loading="lazy" />
          </div>
          <div class="item-name">${item.name}</div>
          <div class="price">${Number(item.price).toFixed(2)} ₽</div>
        `;
        box.appendChild(card);
      });
    }

    // Выбор предмета
    function selectItem(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      const list = activeTab === "bot" ? botItems : userItems;
      renderCatalog(list);
      updateBottomBar();
    }

    // Обновление нижней панели
    function updateBottomBar() {
      const list = activeTab === "bot" ? botItems : userItems;
      const chosen = list.filter(i => selectedIds.has(i.id));

      const count = chosen.length;
      const sum = chosen.reduce((acc, i) => acc + Number(i.price || 0), 0);

      document.getElementById("lblCount").textContent = `Выбрано: ${count}`;
      document.getElementById("lblSum").textContent = `${sum.toFixed(2)} ₽`;

      const btn = document.getElementById("btnSubmit");
      btn.disabled = count === 0;
      btn.textContent = activeTab === "bot" ? "Купить у бота" : "Передать боту";
    }

    // Отправка в бот
    function sendTradeRequest() {
      const list = activeTab === "bot" ? botItems : userItems;
      const chosen = list.filter(i => selectedIds.has(i.id));
      if (chosen.length === 0) return;

      const payload = {
        tab: activeTab,
        items: chosen.map(i => ({
          asset_id: i.id,
          name: i.name,
          price_rub: i.price
        }))
      };

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert(JSON.stringify(payload, null, 2));
      }
    }

    // Старт
    loadBotCatalog();
  </script>
</body>
</html>
